name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lean test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas>=2.2,<3" \
            "numpy>=1.26,<3" \
            "openpyxl>=3.1.5,<4" \
            "scikit-learn>=1.5,<2" \
            "hdbscan>=0.8.40,<0.9" \
            "scipy>=1.12,<2" \
            "matplotlib>=3.8,<4" \
            "pytest>=9.0.3,<10"

      - name: Compile source
        run: python -m compileall -q src run_pipeline.py

      - name: Run tests
        run: python -m pytest -q

      - name: Validate CLI surface
        run: python run_pipeline.py --help

  runtime-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import runtime stack
        run: |
          python - <<'PY'
          import hdbscan
          import matplotlib
          import numpy
          import openpyxl
          import pandas
          import scipy
          import sklearn
          import sentence_transformers
          import torch
          import transformers

          print("pandas", pandas.__version__)
          print("numpy", numpy.__version__)
          print("scikit-learn", sklearn.__version__)
          print("sentence-transformers", sentence_transformers.__version__)
          print("transformers", transformers.__version__)
          print("torch", torch.__version__)
          print("hdbscan", getattr(hdbscan, "__version__", "installed"))
          print("scipy", scipy.__version__)
          print("matplotlib", matplotlib.__version__)
          print("openpyxl", openpyxl.__version__)
          PY

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Lint source and tests
        run: ruff check src tests run_pipeline.py

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt
